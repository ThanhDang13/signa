packages:
  - "apps/*"
  - "packages/*"
  - "packages/contracts/*"
  - "packages/dsl/*"
  - "packages/nest/*"
  - "packages/react/*"
  - "packages/runtime/*"

catalogs:
  default:
    # Type system - critical for consistency
    # Using TS 7 (native/fast) with TS 6 API compatibility for Nx
    typescript: npm:@typescript/typescript6@^6.0.2
    "@typescript/native": npm:typescript@^7.0.2
    tslib: ^2.3.0

    # Validation - widely used across packages
    zod: ^4.0.0

    # NestJS framework
    "@nestjs/common": ^10.0.0
    "@nestjs/core": ^10.0.0
    "@nestjs/swagger": ^7.0.0

    # Database
    drizzle-orm: ^0.45.0
    drizzle-kit: ^0.31.10
    pg: ^8.11.0
    postgres: ^3.4.0
    "@types/pg": ^8.11.0
    "@knaadh/nestjs-drizzle-pg": ^1.0.0

    # Other shared dependencies
    fastify: ^4.0.0
    reflect-metadata: ^0.2.0
    nestjs-zod: ^5.0.0
    "@toss/nestjs-aop": "*"

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@swc/core": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

overrides:
  jiti: "2.7.0"

nodeLinker: isolated
publicHoistPattern:
  - "*"
injectWorkspacePackages: false
minimumReleaseAgeExclude:
  - "@nx/devkit@23.1.3 || 23.2.0-rc.1"
  - "@nx/docker@23.1.3 || 23.2.0-rc.1"
  - "@nx/esbuild@23.1.3 || 23.2.0-rc.1"
  - "@nx/eslint-plugin@23.1.3 || 23.2.0-rc.1"
  - "@nx/eslint@23.1.3 || 23.2.0-rc.1"
  - "@nx/jest@23.1.3 || 23.2.0-rc.1"
  - "@nx/js@23.1.3 || 23.2.0-rc.1"
  - "@nx/nest@23.1.3 || 23.2.0-rc.1"
  - "@nx/node@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-darwin-arm64@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-darwin-x64@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-freebsd-x64@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-linux-arm-gnueabihf@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-linux-arm64-gnu@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-linux-arm64-musl@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-linux-x64-gnu@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-linux-x64-musl@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-win32-arm64-msvc@23.1.3 || 23.2.0-rc.1"
  - "@nx/nx-win32-x64-msvc@23.1.3 || 23.2.0-rc.1"
  - "@nx/react@23.1.3 || 23.2.0-rc.1"
  - "@nx/vite@23.1.3 || 23.2.0-rc.1"
  - "@nx/vitest@23.1.3 || 23.2.0-rc.1"
  - "@nx/web@23.1.3 || 23.2.0-rc.1"
  - "@nx/webpack@23.1.3 || 23.2.0-rc.1"
  - "@nx/workspace@23.1.3 || 23.2.0-rc.1"
  - nx@23.1.3 || 23.2.0-rc.1
  - react-native-worklets@0.14.0-nightly-20260922-79881d984
patchedDependencies:
  expo-modules-core@2.2.3: patches/expo-modules-core@2.2.3.patch
  react-native-screens@4.4.0: patches/react-native-screens@4.4.0.patch
